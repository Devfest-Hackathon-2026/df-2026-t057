<main class="landing" [class.completed]="completed()">
  <img class="landing-logo" src="/logo.png" alt="DOPAGAKI" width="210" height="47" />
  <h1>やることを、次の楽しみに。</h1>

  <div class="landing-flow" role="group" aria-label="DOPAGAKIの使い方（サンプル）">
    <figure>
      <div class="flow-object">
        <div class="task-paper" aria-hidden="true">
          <div class="paper-heading">
            <span>レポート</span>
            <span class="ai-label">AI</span>
          </div>
          <div class="paper-task">
            <span class="task-checkbox"><span class="material-symbols-rounded">check</span></span>
            資料を読む
          </div>
          <div class="paper-task">
            <span class="task-checkbox"><span class="material-symbols-rounded">check</span></span>
            本文を書く
          </div>
          <div class="paper-rule"></div>
          <div class="paper-rule"></div>
        </div>
      </div>
      <figcaption>AIで課題を小分け</figcaption>
    </figure>

    <svg class="flow-link" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <defs>
        <marker
          id="landing-arrow"
          orient="auto"
          markerUnits="userSpaceOnUse"
          refX="7"
          refY="4"
          markerWidth="9"
          markerHeight="9"
        >
          <path
            d="M1 1L7 4 1 7"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
      </defs>
      <line class="across" x1="2" y1="50%" x2="90%" y2="50%" marker-end="url(#landing-arrow)" />
      <line class="down" x1="50%" y1="1" x2="50%" y2="85%" marker-end="url(#landing-arrow)" />
    </svg>

    <figure>
      <div class="flow-object">
        <div class="sample-clock">
          <div class="clock-face" aria-hidden="true">
            <strong>{{ completed() ? '完了！' : '25:00' }}</strong>
            <small>{{ completed() ? 'レポート' : '/ 25分' }}</small>
          </div>
          <button
            mat-flat-button
            class="sample-complete"
            [attr.aria-label]="
              completed() ? '課題完了のサンプルをもう一度見る' : '課題完了のサンプルを試す'
            "
            (click)="completed.set(!completed())"
          >
            <span class="complete-label">
              <span class="material-symbols-rounded" aria-hidden="true">check</span>
              {{ completed() ? 'もう一度' : '完了' }}
            </span>
          </button>
        </div>
      </div>
      <figcaption>タイマーで取り組む</figcaption>
    </figure>

    <svg class="flow-link" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <line class="across" x1="2" y1="50%" x2="90%" y2="50%" marker-end="url(#landing-arrow)" />
      <line class="down" x1="50%" y1="1" x2="50%" y2="85%" marker-end="url(#landing-arrow)" />
    </svg>

    <figure>
      <div class="flow-object">
        <div class="sample-browser" aria-hidden="true">
          <span class="browser-bar"></span>
          <div class="sample-video">
            <span class="video-sun"></span>
            <span class="hill-back"></span>
            <span class="hill-front"></span>
            <span class="video-play"><span class="material-symbols-rounded">play_arrow</span></span>
            <span class="shorts-label">Shorts</span>
          </div>
          <span class="sample-reward">{{ completed() ? '＋5分' : '作業で ＋5分' }}</span>
        </div>
      </div>
      <figcaption>Shortsを楽しむ</figcaption>
    </figure>
  </div>

  <span class="visually-hidden" role="status">
    {{ completed() ? '25分取り組むと視聴時間が5分増えます。この図はサンプルです。' : '' }}
  </span>

  <button
    mat-stroked-button
    class="landing-login"
    (click)="api.login()"
    [disabled]="api.loading() || api.busy() || !api.config()"
  >
    <span class="login-button-content">
      @if (api.loading() || api.authPending()) {
        <mat-spinner diameter="18" aria-hidden="true" />
      } @else {
        <img src="/google-g.png" alt="" width="18" height="18" />
      }
      {{ api.authPending() ? 'ログイン中…' : api.loading() ? '読み込み中…' : 'Googleでログイン' }}
    </span>
  </button>
  <p class="platform-label">Chrome拡張と使う、課題管理アプリ</p>
  <div class="landing-status" role="status">
    @if (api.authPending()) {
      Googleの画面で操作を続けてください。
    } @else if (api.loading()) {
      ログイン状態を確認しています…
    }
  </div>
  @if (api.error()) {
    <div class="landing-error" role="alert">
      <span>{{ api.error() }}</span>
      <button mat-button (click)="api.error.set('')">閉じる</button>
    </div>
  }
  <footer class="landing-footer">
    <a href="/privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
  </footer>
</main>
