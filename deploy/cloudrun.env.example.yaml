# Cloud Run の環境変数の例。値は環境ごとに置き換える（本番のプロジェクトIDなどを既定値にしない）。
# live は GOOGLE_CLOUD_PROJECT・APP_URL・FIREBASE_WEB_CONFIG が無いと起動しない。
APP_MODE: live
GOOGLE_CLOUD_PROJECT: REPLACE_WITH_PROJECT_ID
GOOGLE_CLOUD_LOCATION: global
GEMINI_MODEL: gemini-3.8-flash
AI_USER_PER_MINUTE: '5'
AI_USER_PER_DAY: '30'
AI_GLOBAL_PER_MINUTE: '30'
AI_GLOBAL_PER_DAY: '300'
APP_URL: https://REPLACE_WITH_SERVICE_ORIGIN
FIREBASE_WEB_CONFIG: '{"apiKey":"PUBLIC_FIREBASE_WEB_API_KEY","authDomain":"REPLACE_WITH_PROJECT_ID.firebaseapp.com","projectId":"REPLACE_WITH_PROJECT_ID","appId":"PUBLIC_FIREBASE_APP_ID"}'
# 状態を変える要求を受け付ける Chrome 拡張のID（カンマ区切り）。
EXTENSION_IDS: egongmmfglcolkgiappacmmbiiiogpmb
# Cloud Tasks・Cloud Scheduler の OIDC トークンの audience（省略すると APP_URL）。
OIDC_AUDIENCE: https://REPLACE_WITH_SERVICE_ORIGIN
# Google カレンダー連携。GOOGLE_OAUTH_CLIENT_ID を設定したら、下の4つも必要（deploy/setup-cloud-tasks.sh が値を表示する）。
GOOGLE_OAUTH_CLIENT_ID: REPLACE_WITH_WEB_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET は Secret Manager から --set-secrets で渡す。
CLOUD_TASKS_QUEUE: projects/REPLACE_WITH_PROJECT_ID/locations/REPLACE_WITH_REGION/queues/dopagaki-outbox
CLOUD_TASKS_INVOKER: dopagaki-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com
SCHEDULER_INVOKER: dopagaki-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com
