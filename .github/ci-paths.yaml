all:
  - '**'
# 影響するアプリの範囲。実行頻度・テストのみの除外は deploy/ci-policy.mjs が決める。
full: &full
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - '.npmrc'
  - 'mise.toml'
  - '.nvmrc'
  - 'eslint.config.js'
  - 'stylelint.config.js'
  - 'tsconfig.base.json'
  - '.prettierrc.json'
  - '.prettierignore'
  - '.github/**'
code:
  - *full
  - 'apps/**'
  - 'packages/**'
  - 'e2e/**'
  - 'deploy/**'
  - 'Dockerfile'
  - '.dockerignore'
api:
  - *full
  - 'apps/api/**'
  - 'packages/contract/**'
web:
  - *full
  - 'apps/web/**'
  - 'packages/**'
extension:
  - *full
  - 'apps/extension/**'
  - 'packages/**'
shared:
  - *full
  - 'packages/**'
generate:
  - *full
  - 'apps/api/**'
  - 'packages/contract/**'
  - 'packages/tokens/**'
e2e:
  - *full
  - 'apps/**'
  - 'packages/**'
  - 'e2e/**'
e2e_sources:
  - 'e2e/**'
deploy:
  - 'apps/api/**'
  - 'apps/web/**'
  # bridgeも管理画面の依存。共通パッケージはすべて配信対象に含める。
  - 'packages/**'
  - 'Dockerfile'
  - '.dockerignore'
  - 'deploy/cloud-run.sh'
  - '.github/workflows/cd.yml'
  - '.npmrc'
  - '.nvmrc'
  - 'tsconfig.base.json'
  - 'apps/*/package.json'
  - 'packages/*/package.json'
  - 'e2e/package.json'
  - 'deploy/package.json'
