name: Set up Node and pnpm
description: Install pinned tools and dependencies using the shared pnpm cache
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v3
      with:
        # Node側もキャッシュがない場合は同じ取得経路を使う。
        fetch_from_github: false
        install_args: node npm:pnpm
        cache: true
    - name: Find pnpm store
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Cache pnpm dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
