name: Set up Go
description: Install pinned Go and restore compilation and module caches
inputs:
  cache-suffix:
    description: Cache purpose (for example -api or -build). Each purpose restores only its own caches
    default: ''
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v3
      with:
        # GitHub Releasesの504でキャッシュ未作成のmainが止まるため、公式ミラーを使う。
        fetch_from_github: false
        install_args: go
        cache: true
    - name: Prepare Go cache directories
      shell: bash
      run: mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build" "$HOME/.cache/golangci-lint"
    - name: Cache Go dependencies and compilation
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        # 用途ごとに分ける（-race のテストと Lint の結果を、通常のビルドへ持ち込んでも使えず、全体を作り直すため）。
        # 用途の名前を先頭に置き、復元の候補も同じ用途のキャッシュだけにする。
        key: go${{ inputs.cache-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'apps/api/go.sum') }}-${{ hashFiles('apps/api/**/*.go', 'apps/api/.golangci.yml') }}
        restore-keys: |
          go${{ inputs.cache-suffix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'apps/api/go.sum') }}-
