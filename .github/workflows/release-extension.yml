name: Release extension
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://dopagaki-1032251723022.asia-northeast1.run.app
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:extension
      - name: Package extension
        run: |
          mkdir -p release
          cp extension/INSTALL.txt dist/INSTALL.txt
          (cd dist && zip -r "../release/dopagaki-extension-${RELEASE_TAG}.zip" extension INSTALL.txt)
          unzip -t "release/dopagaki-extension-${RELEASE_TAG}.zip"
          (cd release && sha256sum "dopagaki-extension-${RELEASE_TAG}.zip" > SHA256SUMS.txt)
          cp extension/INSTALL.txt release/notes.md
          printf '\nソース: %s\n' "$GITHUB_SHA" >> release/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/dopagaki-extension-${RELEASE_TAG}.zip" release/SHA256SUMS.txt \
            --verify-tag --title "DOPAGAKI Chrome拡張 ${RELEASE_TAG}" \
            --notes-file release/notes.md
