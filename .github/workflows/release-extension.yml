name: Release extension
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://dopagaki-1032251723022.asia-northeast1.run.app
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node と pnpm のバージョンは mise.toml を正とする（拡張のビルドに Go は使わない）。
      - uses: jdx/mise-action@v3
        with:
          install_args: node pnpm
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dopagaki/extension typecheck
      - run: pnpm --filter @dopagaki/extension test
      # APP_URL（管理画面のオリジン）と RELEASE_TAG（拡張のバージョン）はビルド時に埋め込み、不正なら失敗する。
      - run: pnpm --filter @dopagaki/extension zip
      - name: Package extension
        run: |
          version="${RELEASE_TAG#v}"
          artifact="apps/extension/.output/dopagaki-extension-${version}-chrome.zip"
          test -f "$artifact"
          rm -rf release && mkdir -p release/package/extension
          unzip -q "$artifact" -d release/package/extension
          grep -q "\"version\":\"${version}\"" release/package/extension/manifest.json
          grep -q "\"${APP_URL}/\*\"" release/package/extension/manifest.json
          cp apps/extension/INSTALL.txt release/package/INSTALL.txt
          (cd release/package && zip -qr "../dopagaki-extension-${RELEASE_TAG}.zip" extension INSTALL.txt)
          unzip -t "release/dopagaki-extension-${RELEASE_TAG}.zip"
          (cd release && sha256sum "dopagaki-extension-${RELEASE_TAG}.zip" > SHA256SUMS.txt)
          cp apps/extension/INSTALL.txt release/notes.md
          printf '\nソース: %s\n' "$GITHUB_SHA" >> release/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/dopagaki-extension-${RELEASE_TAG}.zip" release/SHA256SUMS.txt \
            --verify-tag --title "DOPAGAKI Chrome拡張 ${RELEASE_TAG}" \
            --notes-file release/notes.md
