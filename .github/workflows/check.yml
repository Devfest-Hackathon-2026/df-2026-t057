name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # Keep the check result even for documentation-only PRs.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            frontend: &frontend
              - 'web/**'
              - 'extension/**'
              - 'shared/**'
              - 'scripts/build-extension.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'angular.json'
              - 'tsconfig.json'
              - '.github/workflows/check.yml'
            api: &api
              - 'api/**'
              - '.github/workflows/check.yml'
            unit:
              - *frontend
              - 'tests/*.test.ts'
              - 'deploy/cloud-run.sh'
            e2e:
              - *frontend
              - *api
              - 'tests/e2e/**'
              - 'playwright.config.ts'
            container:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/check.yml'
            deploy:
              - 'api/**'
              - 'web/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'angular.json'
              - 'tsconfig.json'
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/cloud-run.sh'
              - '.github/workflows/check.yml'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.unit == 'true' || steps.changes.outputs.e2e == 'true'
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.e2e == 'true'
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: npm ci
        if: steps.changes.outputs.unit == 'true' || steps.changes.outputs.e2e == 'true'
      - run: npm run build
        if: steps.changes.outputs.e2e == 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.frontend == 'true'
      - run: npm run test:unit
        if: steps.changes.outputs.unit == 'true'
      - run: go test -race ./...
        if: steps.changes.outputs.api == 'true'
        working-directory: api
      - run: go vet ./...
        if: steps.changes.outputs.api == 'true'
        working-directory: api
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.e2e == 'true'
      - run: npm run test:e2e
        id: e2e
        if: steps.changes.outputs.e2e == 'true'
      - name: Validate production container
        if: github.event_name == 'pull_request' && steps.changes.outputs.container == 'true'
        run: docker build --platform linux/amd64 -t dopagaki-check .
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: browser-test-results
          path: test-results
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dopagaki-1032251723022.asia-northeast1.run.app
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: devfest-2026-513816
      REGION: asia-northeast1
      SERVICE: dopagaki
      SERVICE_URL: https://dopagaki-1032251723022.asia-northeast1.run.app
      IMAGE: asia-northeast1-docker.pkg.dev/devfest-2026-513816/dopagaki/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --platform linux/amd64 -t "$IMAGE:$GITHUB_SHA" .
      # Authenticate after the build so the short-lived credential is fresh for deployment.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: devfest-2026-513816
          workload_identity_provider: projects/1032251723022/locations/global/workloadIdentityPools/dopagaki-github/providers/github
          service_account: dopagaki-deploy@devfest-2026-513816.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy and verify
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')
          bash deploy/cloud-run.sh "$IMAGE@$digest"
