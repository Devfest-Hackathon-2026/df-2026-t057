name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # 文書だけの変更では、重い検証を省く。結果（成功）は残す。
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - '.nvmrc'
              - 'eslint.config.js'
              - 'stylelint.config.js'
              - 'tsconfig.base.json'
              - '.prettierrc.json'
              - '.prettierignore'
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - '.github/workflows/check.yml'
            deploy:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/contract/**'
              - 'packages/tokens/**'
              - 'packages/messages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/cloud-run.sh'
              - '.github/workflows/check.yml'
      # Node・pnpm・Go・golangci-lint のバージョンは mise.toml を正とする。
      - uses: jdx/mise-action@v3
        if: steps.changes.outputs.code == 'true'
        with:
          cache: true
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm generate
          git diff --exit-code || { echo '::error::生成物が古いままです。pnpm generate を実行してコミットしてください。'; exit 1; }
      - name: Format, lint and typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm check
      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: pnpm test
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build
      - name: Install browser
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @dopagaki/e2e exec playwright install --with-deps chromium
      - name: E2E tests (including accessibility)
        id: e2e
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:e2e
      - name: Validate production container
        if: github.event_name == 'pull_request' && steps.changes.outputs.deploy == 'true'
        run: docker build --platform linux/amd64 -t dopagaki-check .
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: browser-test-results
          path: e2e/test-results
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dopagaki-1032251723022.asia-northeast1.run.app
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: devfest-2026-513816
      REGION: asia-northeast1
      SERVICE: dopagaki
      SERVICE_URL: https://dopagaki-1032251723022.asia-northeast1.run.app
      IMAGE: asia-northeast1-docker.pkg.dev/devfest-2026-513816/dopagaki/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --platform linux/amd64 -t "$IMAGE:$GITHUB_SHA" .
      # Authenticate after the build so the short-lived credential is fresh for deployment.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: devfest-2026-513816
          workload_identity_provider: projects/1032251723022/locations/global/workloadIdentityPools/dopagaki-github/providers/github
          service_account: dopagaki-deploy@devfest-2026-513816.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy and verify
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')
          bash deploy/cloud-run.sh "$IMAGE@$digest"
