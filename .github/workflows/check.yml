name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # 文書だけの変更では、重い検証を省く。結果（成功）は残す。
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: .github/ci-paths.yaml
      # Node・pnpm・Go・golangci-lint のバージョンは mise.toml を正とする。
      - uses: jdx/mise-action@v3
        if: steps.changes.outputs.code == 'true'
        with:
          cache: true
      - name: Cache Go dependencies and compilation
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.api == 'true' || steps.changes.outputs.e2e == 'true')
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          # 新しいソースで更新した結果も次回へ残す。復元時は同じツール・依存のキーを優先する。
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'apps/api/go.sum') }}-${{ hashFiles('apps/api/**/*.go', 'apps/api/.golangci.yml') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'apps/api/go.sum') }}-
      - name: Find pnpm store
        id: pnpm-store
        if: steps.changes.outputs.code == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm dependencies
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generated code is up to date
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.generate == 'true')
        run: |
          pnpm generate
          git diff --exit-code || { echo '::error::生成物が古いままです。pnpm generate を実行してコミットしてください。'; exit 1; }
      - name: Format and frontend lint
        if: steps.changes.outputs.code == 'true'
        run: |
          pnpm format:check
          pnpm lint:ts
          pnpm lint:css
      - name: API lint and race tests
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.api == 'true')
        run: |
          pnpm --filter @dopagaki/api lint
          pnpm --filter @dopagaki/api test
      - name: Shared package checks
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.shared == 'true')
        run: |
          pnpm --filter './packages/**' --recursive --if-present lint
          pnpm --filter './packages/**' --recursive --if-present typecheck
          pnpm --filter './packages/**' --recursive --if-present test
      - name: Web typecheck and unit tests
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.web == 'true')
        run: |
          pnpm --filter @dopagaki/web typecheck
          pnpm --filter @dopagaki/web test
      - name: Extension typecheck and unit tests
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.extension == 'true')
        run: |
          pnpm --filter @dopagaki/extension typecheck
          pnpm --filter @dopagaki/extension test
      - name: E2E typecheck
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.e2e == 'true')
        run: pnpm --filter @dopagaki/e2e typecheck
      - name: Deploy and CI regression tests
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter @dopagaki/deploy test
      - name: Build
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.e2e == 'true')
        run: pnpm build
      - name: Install browser
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.e2e == 'true')
        run: pnpm --filter @dopagaki/e2e exec playwright install --with-deps chromium
      - name: E2E tests (including accessibility)
        id: e2e
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || steps.changes.outputs.e2e == 'true')
        env:
          EXTENSION_ONLY: ${{ github.event_name == 'pull_request' && steps.changes.outputs.extension == 'true' && steps.changes.outputs.web != 'true' && steps.changes.outputs.api != 'true' && steps.changes.outputs.e2e_sources != 'true' }}
        run: |
          if [ "$EXTENSION_ONLY" = 'true' ]; then
            pnpm --filter @dopagaki/e2e exec playwright test 'extension.*\.spec\.ts'
          else
            pnpm test:e2e
          fi
      - name: Set up container builder
        if: github.event_name == 'pull_request' && steps.changes.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Validate production container
        if: github.event_name == 'pull_request' && steps.changes.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: browser-test-results
          path: e2e/test-results
          retention-days: 3
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dopagaki-1032251723022.asia-northeast1.run.app
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: devfest-2026-513816
      REGION: asia-northeast1
      SERVICE: dopagaki
      SERVICE_URL: https://dopagaki-1032251723022.asia-northeast1.run.app
      IMAGE: asia-northeast1-docker.pkg.dev/devfest-2026-513816/dopagaki/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up container builder
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      # Authenticate after the build so the short-lived credential is fresh for deployment.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: devfest-2026-513816
          workload_identity_provider: projects/1032251723022/locations/global/workloadIdentityPools/dopagaki-github/providers/github
          service_account: dopagaki-deploy@devfest-2026-513816.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push image
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Deploy and verify
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')
          bash deploy/cloud-run.sh "$IMAGE@$digest"
