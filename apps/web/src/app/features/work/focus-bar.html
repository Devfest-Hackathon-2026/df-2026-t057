@if (work.session(); as session) {
  <section class="focus-bar" [attr.aria-label]="text().work.focusBar.label">
    <div class="summary">
      <span class="status-dot" [class.paused]="!session.running" aria-hidden="true"></span>
      <strong class="title">{{ task()?.title ?? text().work.focusBar.untitled }}</strong>
      <span class="clock" role="timer" aria-live="off">{{ clock() }}</span>
      <span class="limit">{{ text().work.focusBar.limit(work.limitMinutes()) }}</span>
      @if (!session.running) {
        <span class="paused-label">{{ text().work.focusBar.paused }}</span>
      }
    </div>
    <div class="actions">
      <button mat-button type="button" (click)="toggle()" [disabled]="busy()">
        {{ session.running ? text().work.focusBar.pause : text().work.focusBar.resume }}
      </button>
      <button mat-button type="button" (click)="actions.confirmWork()" [disabled]="busy()">
        {{ text().work.focusBar.confirm }}
      </button>
      <button mat-flat-button type="button" (click)="complete()" [disabled]="busy() || !task()">
        {{ text().work.focusBar.complete }}
      </button>
    </div>
    <mat-progress-bar
      class="progress"
      mode="determinate"
      [value]="work.progress()"
      [attr.aria-label]="text().work.focusBar.progress"
    />
    @if (error(); as error) {
      <p class="error" role="alert">{{ error.message }}</p>
    }
  </section>
}
