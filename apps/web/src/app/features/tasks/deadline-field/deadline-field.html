<fieldset [disabled]="disabled()">
  <legend>締切</legend>
  <div class="quick" role="group" aria-label="締切の日付をすばやく選ぶ">
    @for (option of quick; track option.label) {
      <button
        type="button"
        [matButton]="option.key === date() ? 'tonal' : 'outlined'"
        [attr.aria-pressed]="option.key === date()"
        [disabled]="disabled()"
        (click)="setDate(option.key)"
      >
        {{ option.label }}
      </button>
    }
  </div>
  <div class="pickers">
    <mat-form-field appearance="outline">
      <mat-label>締切日</mat-label>
      <input
        matInput
        class="date-input"
        [matDatepicker]="picker"
        [min]="today"
        [value]="dateObject()"
        (dateChange)="pickDate($event.value)"
        (click)="picker.open()"
        (blur)="onTouched()"
        [disabled]="disabled()"
        required
      />
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>締切時刻</mat-label>
      <input
        matInput
        #timeInput
        #timeTrigger="matAutocompleteTrigger"
        [matAutocomplete]="timeOptions"
        [formControl]="timeControl"
        (blur)="onTouched()"
        [pattern]="timePattern.source"
        placeholder="HH:mm"
        maxlength="5"
        required
      />
      <button
        mat-icon-button
        matIconSuffix
        type="button"
        aria-label="締切時刻の候補を開く"
        [attr.aria-expanded]="timeTrigger.panelOpen"
        [disabled]="disabled()"
        (click)="timeInput.focus(); timeTrigger.openPanel()"
      >
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-autocomplete #timeOptions="matAutocomplete" (opened)="scrollToTime()">
        @for (option of times(); track option) {
          <mat-option
            [value]="option"
            [attr.data-time]="option"
            [class.current-time]="option === time()"
          >
            {{ option }}
          </mat-option>
        }
      </mat-autocomplete>
      <mat-hint>1分単位で入力できます</mat-hint>
      <mat-error>00:00〜23:59で入力してください</mat-error>
    </mat-form-field>
  </div>
  @if (summary(); as summary) {
    <p class="summary" [class.past]="summary.past" [attr.role]="summary.past ? 'alert' : null">
      {{ summary.text }}
    </p>
  }
</fieldset>
